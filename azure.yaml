# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: customer-chatbot-solution-accelerator
metadata:
  template: customer-chatbot-solution-accelerator@1.0

# AVM Deployment Configuration
infra:
  path: infra

# Servicios para que azd construya y suba imágenes Docker al ejecutar azd up
services:
  web:
    project: ./src/App
    language: ts
    host: appservice
    docker:
      path: ./src/App/Dockerfile
      context: .
  api:
    project: ./src/api
    language: py
    host: appservice
    docker:
      path: ./src/api/Dockerfile
      context: ./src/api
